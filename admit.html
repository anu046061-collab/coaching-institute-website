<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admit Card</title>

  <!-- QR CODE -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #5f9cff, #c2e0ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #0a3d62;
      color: white;
      border: none;
      cursor: pointer;
    }

    #card {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Get Admit Card</h2>

  <input type="text" id="roll" placeholder="Enter Roll Number">

  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="getData()">Get Admit Card</button>

  <div id="card"></div>
</div>

<script type="module" src="admit.js"></script>

</body>
</html>
