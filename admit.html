<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8">
  <title>Admit Card</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      width: 300px;
      margin: 50px auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      background: black;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: darkblue;
    }

    #card {
      margin-top: 20px;
      padding: 15px;
      background: #e8f0fe;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Get Admit Card</h2>

    <!-- INPUT -->
    <input type="text" id="roll" placeholder="Enter Roll Number" required>
<div style="position:relative; width:250px; margin:auto;">
  
  <input type="password" id="password" placeholder="Enter Password"
    style="width:100%; padding:10px;">

  <i class="fa-solid fa-eye" onclick="togglePassword()"
    style="
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
    ">
  </i>

</div>

    <!-- BUTTON -->
    <button onclick="getData()">Get Admit Card</button>

    <!-- RESULT -->
    <div id="card"></div>
  </div>
>
  <!-- JS -->
  <script type="module" src="admit.js"></script>

</body>
</html>
