<!DOCTYPE html>
<html>

<head>
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
    }

    h2 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #0a2540;
      color: white;
    }
  </style>
</head>

<body>
  <div class="analytics">
    <div class="card">
      <h3>Total Students</h3>
      <p id="totalStudents">0</p>
    </div>

    <div class="card">
      <h3>Admit Card Views</h3>
      <p id="totalViews">0</p>
    </div>
  </div>

  <h2>Student Enquiries</h2>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Course</th>
        <th>Date & time</th>
        <th>Roll</th>
        <th>Password</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>

  <script type="module" src="dashboard.js"></script>

</body>

</html>
